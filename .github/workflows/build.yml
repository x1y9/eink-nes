name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# 发布 Release 需要写权限。仓库默认的 GITHUB_TOKEN 是只读的,
# 不显式声明会报 "Resource not accessible by integration" (403)。
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: 装交叉编译工具链
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc-arm-linux-gnueabihf \
            g++-arm-linux-gnueabihf \
            qemu-user-static

      - name: 编译 QuickNES 核心
        run: bash scripts/build_core.sh

      - name: 编译主程序
        run: bash scripts/build_app.sh

      - name: 验证产物 (架构 / 静态链接 / 零依赖)
        run: |
          set -e
          file build/eink-nes
          file build/eink-nes | grep -q "ARM, EABI5"
          file build/eink-nes | grep -q "statically linked"
          nm=$(arm-linux-gnueabihf-readelf -d build/eink-nes 2>/dev/null | grep -c NEEDED || true)
          echo "NEEDED=$nm"
          test "$nm" = "0"

      - name: 冒烟测试 (QEMU 干跑, 不需要真 framebuffer)
        run: |
          set -e
          python3 scripts/make_test_rom.py /tmp/test.nes
          # -d / --dry-run: 内存模拟 1072x1448 PW3 屏幕, 验证核心 + 渲染管线
          # 程序内部会统计灰度层次数, <3 层返回 exit 2
          echo "--- 短选项 -d ---"
          timeout 120 qemu-arm-static ./build/eink-nes -d -n 100 /tmp/test.nes
          # 长选项单独测一次: KUAL 脚本用 --dry-run, getopt 不认长选项会直接
          # 退出(之前就是这样静默失败的), 回归必须卡住
          echo "--- 长选项 --dry-run ---"
          timeout 120 qemu-arm-static ./build/eink-nes --dry-run -n 100 /tmp/test.nes
          echo "--- --help 应返回 1 且打印用法 ---"
          qemu-arm-static ./build/eink-nes --help 2>&1 | grep -q "dry-run"
          echo "冒烟测试通过"

      - name: 打包
        run: bash scripts/package.sh

      # KUAL 靠 config.xml 发现扩展。少了它扩展不会出现在菜单里, 而且
      # 这种错误在 CI 里看不出来 —— 只有真机打开 KUAL 才会发现。必须卡死。
      - name: 校验 KUAL 扩展完整性
        run: python3 scripts/check_kual.py dist/extensions/eink-nes

      - uses: actions/upload-artifact@v4
        with:
          name: eink-nes-pw3
          path: |
            eink-nes-pw3.tar.gz
            build/eink-nes

      - name: 发布 Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            eink-nes-pw3.tar.gz
            build/eink-nes
          body: |
            Kindle Paperwhite 3 NES emulator.

            **Assets**
            - `eink-nes-pw3.tar.gz` — install package, extract to `/mnt/us`
            - `eink-nes` — standalone ARMv7 static binary

            **Install**
            ```bash
            tar xzf eink-nes-pw3.tar.gz -C /mnt/us
            ```
            Then KUAL -> eink-nes -> Launch.

            **Layout** (self-contained, nothing outside the extension dir)
            ```
            /mnt/us/extensions/eink-nes/
              eink-nes        binary
              eink-nes.sh     KUAL launcher
              eink-nes.log    runtime log
              roms/           put .nes files here
            ```

            **Troubleshooting**
            ```bash
            cd /mnt/us/extensions/eink-nes
            sh eink-nes.sh            # run manually, log to eink-nes.log
            sh eink-nes.sh --probe    # scan eink ioctl numbers
            ```
          generate_release_notes: true
